# configs/electronics_dataset.yaml
dataset: electronics
has_secondary_id: true               # N8 = users
has_structural_edges: false          # no E10d
secondary_id_is_list: false          # secondary_id = single user_id string per review
embedding_prefix: review              # review_embeddings.npy (T12b)
contextual_embedding_available: true  # review_embeddings_contextual.npy (T12a)
secondary_embedding_prefix: user       # user_embeddings.npy + user_index.json
aggregate_embedding_prefix: family     # family_embeddings.npy + family_index.json
# m1_meta_url triggers the frequency-ranked l3_cat M1 scheme in label_factory.py.
# Presence of this key (any dataset, any category) enables the meta-join path;
# absence means categorical_label from raw.jsonl is used directly (History, ArXiv).
scalar_label_transform: log1p        # helpful_vote is heavy-tailed; log1p before averaging
m1_meta_url: "https://huggingface.co/datasets/McAuley-Lab/Amazon-Reviews-2023/resolve/main/raw/meta_categories/meta_Electronics.jsonl"

# E11b structural-similarity k-NN parameter (pre-publication audit FIX 3).
# k=50 default degenerated into near-complete graphs under centrality-tie
# clustering (see AUDIT_pre_publication.md). k=5 empirically validated on
# ArXiv/N7/T12a (RAGAS 0.359->0.639, raw_gnn unchanged p=0.302).
k_structural: 5

# N8 minimum_hub_size (pre-publication audit FIX 4): filters N8 nodes to
# those with >= this many associated N7 nodes. Default 1 = no filtering
# (current/original behavior; 87-98% of N8 nodes are singletons at this
# setting). See AUDIT_pre_publication.md FIX 4: no value >=2 keeps enough
# nodes at 1000-row GNN-training-sample scale for Amazon; min_hub_size=2-3
# is viable at the larger pooled GraphRAG-graph scale only. Left at 1 here
# pending the targeted pooled-scale rerun (see rerun plan).
minimum_hub_size: 1
