# Configuration Template for Ontological Generalization Framework
# Copy this file to config.yaml and customize for your experiments

# ==============================================================================
# DATA CONFIGURATION
# ==============================================================================
data:
  # Path to ArXiv JSONL dataset
  data_path: "code/data/arxiv_subset_10k.jsonl"
  
  # Number of articles to load (null for all)
  subset_size: 10000
  
  # Directory for storing/loading embeddings
  embedding_dir: "code/data"
  
  # Prefix for embedding files (e.g., "subset_" -> "subset_article_embeddings.npy")
  embedding_prefix: ""
  
  # Use precomputed embeddings instead of recomputing
  use_precomputed_embeddings: false
  
  # Force recompute embeddings even if they exist
  force_recompute: false
  
  # Save computed embeddings to disk
  save_embeddings: true
  
  # SentenceTransformer model name
  sbert_model: "all-MiniLM-L6-v2"

# ==============================================================================
# ONTOLOGICAL SPACE DEFINITION
# ==============================================================================
ontology:
  # Task indices [1-6]: Categorical/Scalar for Node/Edge/Global
  # 1: node_categorical, 2: node_scalar, 3: edge_categorical,
  # 4: edge_scalar, 5: global_categorical, 6: global_scalar
  task_indices: [1]
  
  # Node indices [7-9]: Primary/Secondary/Aggregate
  # 7: paper, 8: author, 9: journal (not implemented)
  node_indices: [7, 8]
  
  # Edge indices [10-13]: Ground Truth/Semantic/Structural/Functional
  # 10: coauthorship, 11: cosine_similarity, 
  # 12: citation_stats (not implemented), 13: topic_tags (not implemented)
  edge_indices: [10, 11]
  
  # Text fidelity indices [a-e]: Super/Standard/Mid/Poor/Baseline
  # a: 100% text (super), b: 75% (standard), c: 50% (mid),
  # d: 25% (poor), e: title only (baseline)
  text_indices: ["a", "b"]
  
  # Cosine similarity thresholds for edge_idx=11
  # a: 0.60, b: 0.75, c: 0.90
  similarity_thresholds: ["b", "c"]

# ==============================================================================
# MODEL CONFIGURATION
# ==============================================================================
model:
  # Model type: sage, gcn, gat
  model_type: "sage"
  
  # Hidden dimension size
  hidden_dim: 256
  
  # Dropout probability
  dropout: 0.5
  
  # Number of output classes
  num_classes: 10

# ==============================================================================
# TRAINING CONFIGURATION
# ==============================================================================
training:
  # Learning rate
  lr: 0.001
  
  # L2 regularization strength
  weight_decay: 0.0005
  
  # Number of training epochs
  epochs: 200
  
  # Early stopping patience (epochs without improvement)
  patience: 50
  
  # Device: cuda, cpu, or auto
  device: "auto"

# ==============================================================================
# OUTPUT CONFIGURATION
# ==============================================================================
output:
  # Main output directory
  output_dir: "code/output"
  
  # Save trained model checkpoints
  save_models: false
  
  # Save TAG graphs to disk
  save_tags: false

# ==============================================================================
# ANALYSIS CONFIGURATION
# ==============================================================================
analysis:
  # Decision Tree maximum depth
  dt_max_depth: 5
  
  # Decision Tree minimum samples to split
  dt_min_samples_split: 5
  
  # Generate and save decision tree visualization
  plot_decision_tree: true
  
  # Number of top configurations to display
  top_k: 5

# ==============================================================================
# EXPERIMENT SCALING EXAMPLES
# ==============================================================================
# Uncomment and modify to customize your ontological space:

# Small-scale exploration (12 experiments):
# node_indices: [7, 8]
# edge_indices: [10, 11]
# text_indices: ["a", "b"]
# similarity_thresholds: ["b", "c"]
# Total: 2 nodes × 2 edges × 2 texts × 2 thresholds ≈ 12 variants

# Medium-scale exploration (120 experiments):
# task_indices: [1, 2]
# node_indices: [7, 8]
# edge_indices: [10, 11]
# text_indices: ["a", "b", "c"]
# similarity_thresholds: ["a", "b", "c"]
# Total: 2 tasks × 2 nodes × 2 edges × 3 texts × 3 thresholds ≈ 120 variants

# Large-scale exploration (360 experiments):
# task_indices: [1, 2, 3, 4, 5, 6]
# node_indices: [7, 8, 9]
# edge_indices: [10, 11, 12, 13]
# text_indices: ["a", "b", "c", "d", "e"]
# Total: 6 tasks × 3 nodes × 4 edges × 5 texts = 360 variants
# Note: Some combinations require implementation (journal nodes, citation edges)

# ==============================================================================
# PERFORMANCE OPTIMIZATION
# ==============================================================================
performance:
  # Use mixed precision training (requires CUDA)
  use_amp: false
  
  # Number of workers for data loading
  num_workers: 4
  
  # Pin memory for faster GPU transfer
  pin_memory: true

# ==============================================================================
# REPRODUCIBILITY
# ==============================================================================
reproducibility:
  # Random seed for reproducibility
  random_seed: 42
  
  # Enable deterministic algorithms (may reduce performance)
  deterministic: false
